name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Timerlight/Timerlight.csproj

      - name: Build
        run: dotnet build src/Timerlight/Timerlight.csproj -c Release --no-restore

      - name: Publish self-contained executable
        run: >
          dotnet publish src/Timerlight/Timerlight.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Timerlight-win-x64
          path: publish/Timerlight.exe
          if-no-files-found: error

  release:
    name: Attach executable to the release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Timerlight-win-x64
          path: publish

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" publish/Timerlight.exe --title "Timerlight $GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" publish/Timerlight.exe --clobber
